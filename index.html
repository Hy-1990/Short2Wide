<main id="home-main" class="home-content">
<section class="home-projects" aria-labelledby="projects-title"><div class="projects-heading"><div><h2 id="projects-title">本机项目</h2><span id="projects-count"></span></div><button type="button" id="refresh-projects" class="text-button">刷新</button></div><div id="projects-grid" class="projects-grid" aria-live="polite"><p class="projects-placeholder">读取本机项目…</p></div></section>
<section class="home-hero" aria-labelledby="home-title"><h2 class="returning-title">开始新的改编</h2>
<h1 id="home-title"><span>你的内容，</span><span>不止一种画幅。</span></h1>
<p class="hero-description">横屏与竖屏之间，保留你的声音。</p>
<form id="import-video" class="import-form" novalidate><label class="sr-only" for="home-source">视频链接</label><div class="import-input-wrap"><svg><use href="#i-link"/></svg><input id="home-source" type="url" placeholder="粘贴 YouTube / TikTok 链接" autocomplete="off" aria-describedby="import-help import-error"><button type="submit" class="button button-primary"><span>开始改编</span><svg><use href="#i-arrow"/></svg></button></div><div class="home-import-options"><div class="home-ratios" role="group" aria-label="目标画幅"><button type="button" class="active" data-home-ratio="16:9" aria-pressed="true"><span class="format-icon horizontal"></span><span>横屏</span><small>16:9</small></button><button type="button" data-home-ratio="9:16" aria-pressed="false"><span class="format-icon vertical"></span><span>竖屏</span><small>9:16</small></button></div><button type="button" id="home-upload" class="local-upload"><svg><use href="#i-upload"/></svg><span id="home-file-name">上传视频</span></button><input id="home-file" type="file" accept="video/*" hidden></div><p id="import-error" class="home-error" role="alert" hidden></p><p class="import-help" id="import-help">支持小于5分钟的视频</p></form>
</section>
<section class="hero-visual creator-showcase" aria-label="创作者原片预览，非模型改编结果"><div class="creator-video"><video src="assets/showcase-source.mp4" poster="assets/showcase-source.jpg" muted autoplay loop playsinline controls aria-label="云海栈桥原片"></video></div><div class="visual-caption"><span>创作者原片</span><span>9:16 · 00:15</span></div><div class="creator-formats"><span>9:16<svg><use href="#i-arrow"/></svg>16:9</span><span>换个画幅，保留原音</span></div></section>
<section class="home-guide"><ol class="workflow-steps"><li><span>01</span><strong>导入视频</strong></li><li><span>02</span><strong>分段改编</strong></li><li><span>03</span><strong>核对并导出</strong></li></ol><details><summary><span>如何使用</span><svg><use href="#i-down"/></svg></summary><p>粘贴链接或上传小于5分钟的视频，选择目标画幅。按画面变化与停顿分段，逐段生成并核对，最后合成导出。</p><p>回填原音不会自动保证同步，口型与动效仍需检查。</p></details></section>
