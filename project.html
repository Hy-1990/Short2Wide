<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f2"><title>画幅工作台</title><link rel="icon" href="assets/favicon.svg"><script src="preferences.js"></script><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="settings.css"><link rel="stylesheet" href="project.css?v=0.1.9"><script src="i18n.js" defer></script><script src="ui-feedback.js" defer></script><script src="settings.js" defer></script><script src="project.js?v=0.1.9" defer></script></head><body class="project-page"><a class="skip-link" href="#project-main">跳到工作台</a><header class="project-header"><a href="./" class="project-back" aria-label="返回首页"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg><span>画幅工作台</span></a><span class="project-name" id="project-name">读取项目…</span><div data-app-controls></div></header><main id="project-main"><div class="project-loading" id="loading" role="status"><span class="working-frame" aria-hidden="true"><i class="frame-wide"></i><i class="frame-tall"></i></span><h1>准备视频</h1><p id="loading-message">正在读取素材…</p><small id="loading-clock" aria-live="off"></small><a class="button button-secondary" href="./">返回首页</a></div><div id="project-editor" hidden><section class="review-toolbar"><div><h1 id="segment-title">片段</h1><p id="segment-info"></p></div><div class="review-actions"><span class="project-ratio" id="project-ratio"></span><button type="button" class="button button-secondary" id="sync-play">同步播放</button><button type="button" class="button button-primary" id="export-project">确认全部并导出</button><a class="button button-primary" id="download-export" hidden>下载视频</a></div></section><p id="export-hint" class="export-hint"></p><div class="real-workspace"><section class="real-editor"><div class="real-preview"><figure><figcaption><span>原片</span><span class="video-caption-actions"><span id="source-clock">00:00</span><button type="button" id="play-source" class="video-play-toggle" aria-label="单独播放原片">播放</button></span></figcaption><video id="source-video" controls preload="metadata" playsinline></video></figure><figure><figcaption><span>改编画面</span><span class="video-caption-actions"><button type="button" id="play-result" class="video-play-toggle" aria-label="单独播放生成视频">播放</button><span class="select-wrap"><select id="audio-mode" aria-label="预览声音"><option value="original">原音 + 对齐画面</option><option value="native">模型原生音画</option></select><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></span></span></figcaption><div class="output-stage"><video id="result-video" playsinline preload="metadata" controls hidden></video><div id="output-empty"><svg viewBox="0 0 24 24"><path d="M8 3H4v5m12-5h4v5M4 16v5h4m12-5v5h-4M8 8h8v8H8z"/></svg><p id="output-message">先生成这个片段</p></div><div id="render-progress" class="render-progress" role="status" hidden><span class="working-frame" aria-hidden="true"><i class="frame-wide"></i><i class="frame-tall"></i></span><strong id="render-title"></strong><span id="render-hint"></span><small id="render-clock" aria-live="off"></small></div></div></figure></div><p class="real-note" id="preview-note">默认将画面时长归一到原片。文字、动作与口型需要逐段核对。</p><div id="project-error" class="real-error" role="alert" hidden><span id="project-error-summary"></span><details><summary>错误详情</summary><pre id="project-error-detail" data-no-translate></pre></details></div><section class="real-timeline"><div class="real-section-title"><h2>视频片段</h2><span id="project-progress"></span></div><div id="real-shots" class="real-shots"></div></section><div class="project-status" id="project-status" role="status"></div></section><aside class="real-inspector"><section><div class="real-section-title"><h2>画面要求</h2><span>Seedance 2.5 · 720p</span></div><label class="sr-only" for="real-prompt">当前片段的画面要求</label><textarea id="real-prompt" rows="3" maxlength="1000" placeholder="补充需要保留或调整的内容"></textarea><label class="model-audio-option"><input type="checkbox" id="model-audio"><span>生成对照音轨</span></label><p class="field-note">仅供对照播放，导出使用原片声音。</p><p class="field-note">生成会上传当前片段至 DreamAPI 并计费。</p><button type="button" class="button button-primary" id="generate-segment">生成这个片段</button><p class="model-status" id="model-status" role="status"></p></section><details id="align-section" class="advanced-options" hidden><summary><span>手动对齐</span><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg></summary><div class="advanced-content"><div id="cue-options"><p class="field-note">找出原片与模型原生画面中相同的两个事件，填写各自的片段内秒数。</p><div class="anchor-grid"><span>节点</span><span>原片 / 秒</span><span>生成 / 秒</span><span>1</span><input id="anchor-s1" type="number" min="0" step="0.01" aria-label="节点1原片秒数"><input id="anchor-g1" type="number" min="0" step="0.01" aria-label="节点1生成秒数"><span>2</span><input id="anchor-s2" type="number" min="0" step="0.01" aria-label="节点2原片秒数"><input id="anchor-g2" type="number" min="0" step="0.01" aria-label="节点2生成秒数"></div><div class="align-actions"><button type="button" class="button button-secondary" id="apply-alignment">应用节点对齐</button><button type="button" class="text-button" id="reset-alignment">重置</button></div></div></div></details></aside></div></div></main></body></html>
